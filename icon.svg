<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36" role="img" aria-labelledby="dshIconTitle dshIconDesc">
  <title id="dshIconTitle">Open book with bookmark</title>
  <desc id="dshIconDesc">An open book with distinct left and right pages, a clear spine gap, and a bookmark ribbon on the upper right, filled with a soft cyan-to-blue gradient, drawn on a fully transparent background.</desc>
  <defs>
    <linearGradient id="bookPageGradient" x1="11" y1="11.5" x2="25" y2="24.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#55d6cf"/>
      <stop offset="1" stop-color="#4b63e8"/>
    </linearGradient>
  </defs>
  <!-- book cover base peeking out under the pages for a thick, layered look -->
  <g id="bookCover" fill="#3b4bce">
    <path transform="translate(-0.5 1)" d="M 17.35 12.9 C 15.4 11.3 13 10.9 11.3 11.6 Q 10.9 11.8 10.9 12.4 L 10.9 21.9 Q 10.9 22.7 11.7 23 C 13.2 23.5 15.5 23.9 17.35 24.7 Z"/>
    <path transform="translate(0.5 1)" d="M 18.65 12.9 C 20.6 11.3 23 10.9 24.7 11.6 Q 25.1 11.8 25.1 12.4 L 25.1 21.9 Q 25.1 22.7 24.3 23 C 22.8 23.5 20.5 23.9 18.65 24.7 Z"/>
  </g>
  <!-- open book: two pages with a clear negative-space spine between them -->
  <g id="bookPages" fill="url(#bookPageGradient)">
    <path id="pageLeft" d="M 17.35 12.9 C 15.4 11.3 13 10.9 11.3 11.6 Q 10.9 11.8 10.9 12.4 L 10.9 21.9 Q 10.9 22.7 11.7 23 C 13.2 23.5 15.5 23.9 17.35 24.7 Z"/>
    <path id="pageRight" d="M 18.65 12.9 C 20.6 11.3 23 10.9 24.7 11.6 Q 25.1 11.8 25.1 12.4 L 25.1 21.9 Q 25.1 22.7 24.3 23 C 22.8 23.5 20.5 23.9 18.65 24.7 Z"/>
  </g>
  <!-- bookmark ribbon on the upper right page -->
  <path id="bookmarkRibbon" fill="#ffffff" d="M 21.7 10.6 Q 21.7 9.7 22.6 9.7 L 23.5 9.7 Q 24.4 9.7 24.4 10.6 L 24.4 17.6 L 23.05 16.1 L 21.7 17.6 Z"/>
</svg>
